<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenku México · Respaldo independiente</title>
<style>html{color-scheme:dark;font:14px system-ui;background:#080d18;color:#e8edf5}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:21px;margin:0}p{color:#9ba9bf;line-height:1.5}nav,form,.pager{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}button,input,select{font:inherit;color:inherit;background:#101827;border:1px solid #303b4e;border-radius:5px;padding:9px 12px}button{cursor:pointer}button[aria-pressed=true]{color:#d5c1ff;border-color:#9a75ed;background:#281e41}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #b69aef;outline-offset:2px}select{display:block;width:min(100%,560px);max-width:100%;min-width:0}input{flex:1;min-width:140px;max-width:500px}.wrap{overflow:auto;border:1px solid #303b4e;border-radius:6px}table{width:100%;min-width:850px;border-collapse:collapse;font-size:12px;text-align:left}th,td{padding:12px;border-bottom:1px solid #263044;vertical-align:top}th{color:#9ba9bf}td button{border:0;padding:0;background:transparent;text-align:left;color:#d5c1ff}img{width:46px;height:46px;object-fit:cover;border-radius:4px;float:left;margin-right:10px}.pager{justify-content:space-between;font-size:12px}pre{overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5}#detail{border:1px solid #303b4e;padding:16px;margin-top:20px;border-radius:6px}#error{color:#ffaba4}small{color:#9ba9bf}@media(max-width:600px){main{padding:16px}h1{font-size:18px}}</style>
<main><h1>Kenku México · Respaldo independiente</h1><p id="summary">Leyendo la copia local…</p><nav aria-label="Datos"><button data-kind="orders">Pedidos</button><button data-kind="customers">Clientes</button><button data-kind="products">Productos</button></nav><label>Otros recursos preservados <select id="resources" aria-label="Otros recursos"><option value="">Seleccionar recurso</option></select></label><form><input aria-label="Buscar" placeholder="Pedido, nombre, correo, teléfono o SKU"><button>Buscar</button></form><p id="error" role="alert"></p><div class="pager"><span id="count" aria-live="polite"></span><div><button id="prev">Anterior</button> <span id="page"></span> <button id="next">Siguiente</button></div></div><div class="wrap"><table><thead><tr></tr></thead><tbody></tbody></table></div><section id="detail" aria-label="Detalle original" hidden><button id="close">Cerrar detalle</button> <button id="customerOrders" hidden>Pedidos de este cliente</button><pre></pre></section><p><small>Datos históricos de la copia local. El stock y los estados corresponden a la última lectura guardada. Este visor no consulta Shopify, Supabase ni servicios externos.</small></p></main>
<script>
let kind='orders',page=1,search='',customer='',resource='',images={},controller;
const $=s=>document.querySelector(s),text=(tag,value)=>{const e=document.createElement(tag);e.textContent=value??'';return e;};
const money=(value,currency='MXN')=>{try{return new Intl.NumberFormat('es-MX',{style:'currency',currency}).format(Number(value));}catch{return String(value)+' '+currency;}};
async function detail(id){const response=await fetch('/api/detail?'+new URLSearchParams({kind,id,resource}));if(!response.ok)throw Error('No se pudo leer el detalle');const data=await response.json();$('#detail').hidden=false;$('#detail pre').textContent=JSON.stringify(data,null,2);$('#customerOrders').hidden=kind!=='customers';$('#customerOrders').onclick=()=>{customer=id;kind='orders';page=1;search='';$('input').value='';load();};}
async function load(){if(controller)controller.abort();controller=new AbortController();const signal=controller.signal;$('#error').textContent='';$('tbody').replaceChildren();$('#detail').hidden=true;$('#count').textContent='Leyendo datos locales…';$('#prev').disabled=$('#next').disabled=true;document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===kind));try{const response=await fetch('/api/list?'+new URLSearchParams({kind,page,search,customer,resource}),{signal});if(!response.ok)throw Error('No se pudo leer la copia local');const data=await response.json();if(signal.aborted)return;const headings=kind==='orders'?['Pedido','Cliente','Fecha','Pago / envío','Importe','Productos']:kind==='extra'?['Registro','Datos preservados']:kind==='customers'?['Cliente','Correo','Teléfono','Pedidos','Compras históricas']:['Producto','Estado','SKU','Precios','Stock guardado'];$('thead tr').replaceChildren(...headings.map(h=>text('th',h)));for(const row of data.rows){const p=row.data,tr=document.createElement('tr'),open=document.createElement('button');open.onclick=()=>detail(row.id).catch(e=>$('#error').textContent=e.message);const first=document.createElement('td');first.append(open);tr.append(first);if(kind==='orders'){open.textContent=p.name||row.id;const a=p.shipping_address||{},c=p.customer||{};[(c.first_name||a.name||'')+' '+(c.last_name||''),p.created_at,(p.financial_status||'')+' / '+(p.fulfillment_status||'Sin preparar'),money(p.total_price,p.currency),(p.line_items||[]).map(i=>i.quantity+'× '+i.title).join('; ')].forEach(v=>tr.append(text('td',v)));}else if(kind==='customers'){open.textContent=[p.first_name,p.last_name].filter(Boolean).join(' ')||row.id;[p.email,p.phone||p.default_address?.phone,p.orders_count,money(p.total_spent,p.currency||'MXN')].forEach(v=>tr.append(text('td',v)));}else if(kind==='extra'){open.textContent=row.id;tr.append(text('td',JSON.stringify(p).slice(0,600)));}else{open.textContent=p.title||row.id;const image=images[String(p.image?.id)];if(image){const img=document.createElement('img');img.src='/'+image;img.alt='';first.prepend(img);}[p.status,(p.variants||[]).map(v=>v.sku).join(', '),(p.variants||[]).map(v=>money(v.price)).join(', '),(p.variants||[]).map(v=>v.inventory_quantity??'Sin informar').join(', ')].forEach(v=>tr.append(text('td',v)));}$('tbody').append(tr);}$('#count').textContent=data.count.toLocaleString('es-MX')+' registros'+(customer?' · Cliente seleccionado':'');$('#page').textContent=page+' / '+Math.max(1,Math.ceil(data.count/50));$('#prev').disabled=page===1;$('#next').disabled=page*50>=data.count;}catch(e){if(!signal.aborted)$('#error').textContent=e.message;}}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;resource='';$('#resources').value='';page=1;customer='';search='';$('input').value='';load();});$('form').onsubmit=e=>{e.preventDefault();search=$('input').value.trim();page=1;load();};$('#prev').onclick=()=>{page--;load();};$('#next').onclick=()=>{page++;load();};$('#close').onclick=()=>$('#detail').hidden=true;
$('#resources').onchange=e=>{if(!e.target.value)return;kind='extra';resource=e.target.value;customer='';search='';$('input').value='';page=1;load();};fetch('/api/resources').then(r=>r.json()).then(resources=>{for(const r of resources){const option=text('option',r.resource+' ('+r.count.toLocaleString('es-MX')+')');option.value=r.resource;$('#resources').append(option);}});
Promise.all([fetch('/api/meta').then(r=>r.json()),fetch('/api/images').then(r=>r.json())]).then(([meta,map])=>{images=map;$('#summary').textContent='Copia del '+meta.at+' · '+meta.counts.order.toLocaleString('es-MX')+' pedidos · '+meta.counts.customer.toLocaleString('es-MX')+' clientes · '+meta.counts.product+' productos';load();}).catch(e=>$('#error').textContent=e.message);
</script></html>
